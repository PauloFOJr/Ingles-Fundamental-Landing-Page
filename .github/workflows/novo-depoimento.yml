name: Adicionar depoimento

on:
  workflow_dispatch:
    inputs:
      nome:
        description: "Nome da pessoa"
        required: true
      estrelas:
        description: "Estrelas (1 a 5)"
        default: "5"
        required: true
      texto:
        description: "Texto da avaliação (deixe vazio se só tem estrelas)"
        required: false
      cargo:
        description: "Cargo e empresa (ex.: SQL Engineer, PCMS Tech)"
        required: false
      data:
        description: "Mês da avaliação (AAAA-MM, ex.: 2026-10)"
        required: false
      idioma:
        description: "Idioma do texto (pt ou en)"
        default: "pt"
        required: false
      fonte:
        description: "Origem da avaliação"
        type: choice
        options:
          - google
          - outro
        default: google  

permissions:
  contents: write

jobs:
  adicionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Adicionar ao reviews.json
        env:
          NOME: ${{ inputs.nome }}
          CARGO: ${{ inputs.cargo }}
          TEXTO: ${{ inputs.texto }}
          ESTRELAS: ${{ inputs.estrelas }}
          DATA: ${{ inputs.data }}
          IDIOMA: ${{ inputs.idioma }}
        run: |
          jq --arg nome "$NOME" --arg cargo "$CARGO" --arg texto "$TEXTO" \
             --arg data "$DATA" --arg lang "$IDIOMA" --argjson estrelas "$ESTRELAS" \
             '[{nome:$nome, cargo:$cargo, texto:$texto, estrelas:$estrelas, lang:$lang} + (if $data != "" then {data:$data} else {} end)] + .' \
             js/reviews.json > /tmp/reviews.json
          mv /tmp/reviews.json js/reviews.json

      - name: Commit e push
        env:
          NOME: ${{ inputs.nome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/reviews.json
          git commit -m "Novo depoimento: $NOME"
          git push
